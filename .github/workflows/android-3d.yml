name: IRA 3D - Android Main

on:
  push:
    branches: [main]
    paths: ['**', '.github/workflows/android-3d.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-3d:
    name: Validate Godot 3D and export Android
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Android SDK and Godot export templates
        shell: bash
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable/. /github/home/.local/share/godot/export_templates/4.4.1.stable/
          mkdir -p /github/home/.config/godot
          printf "%s\n" '[gd_resource type="EditorSettings" format=3]' '[resource]' 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' 'export/android/android_sdk_path = "/usr/lib/android-sdk"' 'export/android/debug_keystore = "/root/debug.keystore"' 'export/android/debug_keystore_user = "androiddebugkey"' 'export/android/debug_keystore_pass = "android"' > /github/home/.config/godot/editor_settings-4.4.tres
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"
          test -s /root/debug.keystore
          test -s /github/home/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
      - name: Install Python 3 for icon generation and APK checks
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-minimal
      - name: Build distinctive Android icons
        run: python3 tools/build_icon.py
      - name: Import project and check parse errors
        shell: bash
        run: |
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/ira-3d-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error' /tmp/ira-3d-import.log; then exit 1; fi
      - name: Run scene smoke test
        shell: bash
        run: |
          godot --headless --path . --quit-after 110 2>&1 | tee /tmp/ira-3d-run.log
          if grep -E '^SCRIPT ERROR:|^ERROR:' /tmp/ira-3d-run.log; then exit 1; fi
      - name: Build signed Android debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/IRA-3D-v0.5-Combate.apk
          test -s build/IRA-3D-v0.5-Combate.apk
      - name: Verify app identity
        run: python3 tools/verify_apk.py build/IRA-3D-v0.5-Combate.apk
      - name: Upload 3D Android APK
        uses: actions/upload-artifact@v4
        with:
          name: IRA-3D-v0.5-Ciudad-Combate-APK
          path: build/IRA-3D-v0.5-Combate.apk
          if-no-files-found: error
          retention-days: 30
